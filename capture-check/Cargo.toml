[package]
name = "capture-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minimal macOS ScreencaptureKit validator and BGRA recorder"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.3.5"
core-graphics = "0.24"
core-foundation = "0.9"